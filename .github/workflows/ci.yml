name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build, test, and package (CPU + Metal)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Keep dependency caches and the offline configure on the repo default.
      MLXPDLP_MACOS_DEPLOYMENT_TARGET: "14.0"

    steps:
      - name: Check out mlxPDLP
        uses: actions/checkout@v6

      - name: Fingerprint Xcode
        id: xcode
        run: |
          echo "key=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" \
            >> "$GITHUB_OUTPUT"

      - name: Restore native dependencies
        id: native-deps
        uses: actions/cache/restore@v6
        with:
          path: |
            _deps/mlx
            _deps/mlx-build
            _deps/mlx-install
            build/_deps/pslp-src
            build/_deps/pslp-build
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.key }}-mlx-25616a0a6acf-pslp-0.0.8-macos-${{ env.MLXPDLP_MACOS_DEPLOYMENT_TARGET }}-v2

      - name: Bootstrap native dependencies on cache miss
        if: steps.native-deps.outputs.cache-hit != 'true'
        env:
          # Keep MLX's large Metal-kernel build within hosted-runner memory.
          CMAKE_BUILD_PARALLEL_LEVEL: 3
        run: |
          make configure \
            MLXPDLP_FETCH_DEPS=ON \
            CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release"

      - name: Save native dependencies
        if: steps.native-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            _deps/mlx
            _deps/mlx-build
            _deps/mlx-install
            build/_deps/pslp-src
            build/_deps/pslp-build
          key: ${{ steps.native-deps.outputs.cache-primary-key }}

      - name: Configure mlxPDLP offline
        run: >
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.MLXPDLP_MACOS_DEPLOYMENT_TARGET }}
          -DMLX_ROOT=${{ github.workspace }}/_deps/mlx-install
          -DMLX_SOURCE_DIR=${{ github.workspace }}/_deps/mlx
          -DMLX_BUILD_DIR=${{ github.workspace }}/_deps/mlx-build
          -DFETCHCONTENT_SOURCE_DIR_PSLP=${{ github.workspace }}/build/_deps/pslp-src
          -DMLXPDLP_ALLOW_DOWNLOADS=OFF

      - name: Build mlxPDLP
        run: cmake --build build --parallel 3

      - name: Test mlxPDLP
        run: ctest --test-dir build --output-on-failure

      - name: Install mlxPDLP
        run: cmake --install build --prefix "${{ runner.temp }}/mlxpdlp-install"

      - name: Configure installed-package consumer
        run: >
          cmake
          -S examples/installed_consumer
          -B consumer-build
          -DCMAKE_PREFIX_PATH=${{ runner.temp }}/mlxpdlp-install
          -DMLX_ROOT=${{ github.workspace }}/_deps/mlx-install
          -DMLX_BUILD_DIR=${{ github.workspace }}/_deps/mlx-build

      - name: Build and run installed-package consumer
        run: |
          cmake --build consumer-build --parallel 3
          ./consumer-build/mlxpdlp_installed_consumer
