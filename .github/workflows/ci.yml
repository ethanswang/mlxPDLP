name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build, test, and package (CPU + Metal)
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out mlxPDLP
        uses: actions/checkout@v6

      - name: Build mlxPDLP and its managed MLX dependency
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 3
        run: |
          make \
            MLXPDLP_FETCH_DEPS=ON \
            CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release" \
            CMAKE_BUILD_ARGS="--parallel 3"

      - name: Test mlxPDLP
        run: ctest --test-dir build --output-on-failure

      - name: Install mlxPDLP
        run: cmake --install build --prefix "${{ runner.temp }}/mlxpdlp-install"

      - name: Configure installed-package consumer
        run: >
          cmake
          -S examples/installed_consumer
          -B consumer-build
          -DCMAKE_PREFIX_PATH=${{ runner.temp }}/mlxpdlp-install
          -DMLX_ROOT=${{ github.workspace }}/_deps/mlx-install
          -DMLX_BUILD_DIR=${{ github.workspace }}/_deps/mlx-build

      - name: Build and run installed-package consumer
        run: |
          cmake --build consumer-build --parallel 3
          ./consumer-build/mlxpdlp_installed_consumer
